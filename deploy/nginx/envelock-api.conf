# api.envelock.org — the API itself.
#
# The application sets its own security headers (see security/middleware.py), so
# this vhost deliberately adds none: duplicating them here would mean two places
# to keep in sync, and nginx's `add_header` silently drops the app's on some
# response paths.
server {
    listen 80;
    server_name api.envelock.org;

    # An email can carry a large attachment; the app enforces its own 25 MB
    # ceiling, so let the request reach it rather than failing at the proxy with
    # an nginx error page the client cannot parse.
    client_max_body_size 30m;

    location / {
        proxy_pass         http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Connecting a mailbox walks a ladder of candidate IMAP servers, each
        # with its own connect budget. The default 60s read timeout cuts that off
        # mid-probe and shows the customer a gateway error instead of the real
        # reason their server did not answer.
        proxy_read_timeout 120s;
    }
}
