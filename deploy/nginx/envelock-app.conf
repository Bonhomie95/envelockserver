# app.envelock.org — the customer dashboard (client/dist).
server {
    listen 80;
    server_name app.envelock.org;
    root /home/ubuntu/apps/client/dist;
    index index.html;

    # `client/vercel.json` carries these too, for a Vercel deployment. On nginx
    # that file is inert — this is the copy that actually applies.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.envelock.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hashed filenames, so they can be cached forever…
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # …but index.html must never be, or a deploy leaves people on the old bundle
    # pointing at asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;   # client-side routing
    }
}
